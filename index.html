<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Squared</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
    --bg: #080808;
    --panel: #111111;
    --white: #ffffff;
    --muted: #858585;
    --border: #303030;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    justify-content: center;
    padding: 35px 18px 50px;
}

button {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 850px;
}

header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 25px;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo span {
    color: var(--muted);
}

.intro {
    text-align: center;
    padding: 35px 0 28px;
}

.intro h1 {
    font-size: clamp(30px, 6vw, 48px);
    letter-spacing: -2px;
    font-weight: 700;
}

.intro h1 span {
    color: var(--muted);
}

.player-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.player {
    padding: 15px 17px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    transition: 0.2s;
}

.player.active {
    border-color: var(--white);
    background: #1b1b1b;
}

.player:last-child {
    text-align: right;
}

.player-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
}

.player-symbol {
    font-size: 27px;
    font-weight: 700;
    margin-top: 3px;
}

.vs {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
}

.status-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.status-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.status-title {
    font-size: 14px;
    font-weight: 600;
}

.status-description {
    font-size: 11px;
    color: var(--muted);
}

.status-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    white-space: nowrap;
}

.board-container {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 9px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
}

.big-board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    aspect-ratio: 1;
}

.small-board {
    background: #0b0b0b;
    border: 1px solid #383838;
    border-radius: 5px;
    padding: 5px;
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 3px;
    min-width: 0;
    min-height: 0;
    transition: border-color 0.2s, background 0.2s;
}

.small-board.playable {
    border: 2px solid white;
    background: #171717;
}

.small-board.inactive {
    opacity: 0.4;
}

.small-board.won {
    border-color: #777;
    background: #202020;
    opacity: 1;
}

.small-board.drawn {
    border-color: #555;
    opacity: 0.7;
}

.cell {
    border: 1px solid #303030;
    border-radius: 3px;
    background: #141414;
    color: white;
    font-size: clamp(13px, 3.5vw, 29px);
    font-weight: 700;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    min-width: 0;
    min-height: 0;
    transition: background 0.15s, border-color 0.15s;
}

.cell:not(:disabled):hover {
    background: #333;
    border-color: white;
}

.cell:disabled {
    cursor: default;
}

.cell.x {
    color: white;
}

.cell.o {
    color: #999;
}

.cell.winning-cell {
    background: #333;
    border-color: white;
}

.board-result {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.83);
    border-radius: 4px;
    z-index: 2;
    font-size: clamp(38px, 9vw, 75px);
    font-weight: 700;
    pointer-events: none;
    animation: resultAppear 0.3s ease;
}

.board-result.x-result {
    color: white;
}

.board-result.o-result {
    color: #bdbdbd;
}

.board-result.draw-result {
    font-size: clamp(15px, 3vw, 23px);
    color: #aaa;
    letter-spacing: 2px;
}

@keyframes resultAppear {
    from {
        opacity: 0;
        transform: scale(0.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.board-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 0 4px;
}

.board-footer span {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
}

.legend {
    display: flex;
    gap: 15px;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 5px;
}

.legend-dot {
    height: 7px;
    width: 7px;
    background: white;
    border-radius: 50%;
}

.legend-dot.inactive-dot {
    background: #555;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 24px;
}

.control-btn {
    background: white;
    color: black;
    border: 1px solid white;
    border-radius: 6px;
    padding: 12px 23px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.control-btn:hover {
    background: #ccc;
    border-color: #ccc;
}

.game-over {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    z-index: 10;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game-over.show {
    display: flex;
    animation: fadeIn 0.25s ease;
}

.result-card {
    width: 100%;
    max-width: 380px;
    background: #111;
    border: 1px solid #555;
    border-radius: 12px;
    padding: 35px 25px;
    text-align: center;
}

.result-label {
    color: #888;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
}

.result-card h2 {
    font-size: 38px;
    margin: 15px 0 7px;
}

.result-card p {
    color: #888;
    font-size: 13px;
    margin-bottom: 25px;
}

.result-card button {
    width: 100%;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@media (max-width: 520px) {
    body {
        padding: 20px 10px 35px;
    }

    .logo {
        font-size: 19px;
    }

    .intro {
        padding: 28px 0 23px;
    }

    .board-container {
        padding: 5px;
    }

    .big-board {
        gap: 4px;
    }

    .small-board {
        padding: 3px;
        gap: 2px;
    }

    .cell {
        border-radius: 2px;
    }

    .player {
        padding: 11px;
    }

    .status-panel {
        padding: 12px;
    }

    .control-btn {
        padding: 11px 17px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">TIC TAC TOE <span>SQUARED.</span></div>
    </header>

    <section class="intro">
        <h1>Tic Tac Toe <span>Squared.</span></h1>
    </section>

    <section class="player-bar">

        <div class="player active" id="playerX">
            <div class="player-label">PLAYER 01</div>
            <div class="player-symbol">X</div>
        </div>

        <div class="vs">VS</div>

        <div class="player" id="playerO">
            <div class="player-label">PLAYER 02</div>
            <div class="player-symbol">O</div>
        </div>

    </section>

    <section class="status-panel">
        <div class="status-left">
            <div class="status-title" id="statusTitle">
                Player X's turn
            </div>
            <div class="status-description" id="statusDescription">
                Choose any board to begin.
            </div>
        </div>

        <div class="status-tag" id="statusTag">
            FREE PLAY
        </div>
    </section>

    <section class="board-container">
        <div class="big-board" id="bigBoard"></div>
    </section>

    <div class="board-footer">
        <span>3 × 3 × 3 GAME GRID</span>

        <div class="legend">
            <span>
                <div class="legend-dot"></div>
                Available
            </span>
            <span>
                <div class="legend-dot inactive-dot"></div>
                Locked
            </span>
        </div>
    </div>

    <section class="controls">
        <button class="control-btn" onclick="newGame()">
            NEW GAME
        </button>
    </section>

</div>

<div class="game-over" id="gameOver">
    <div class="result-card">

        <div class="result-label">GAME COMPLETE</div>

        <h2 id="resultTitle">PLAYER X WINS</h2>

        <p id="resultDescription">
            Three boards. One victory.
        </p>

        <button class="control-btn" onclick="newGame()">
            PLAY AGAIN
        </button>

    </div>
</div>

<script>

const bigBoard = document.getElementById("bigBoard");

const statusTitle = document.getElementById("statusTitle");
const statusDescription = document.getElementById("statusDescription");
const statusTag = document.getElementById("statusTag");

const playerX = document.getElementById("playerX");
const playerO = document.getElementById("playerO");

const gameOver = document.getElementById("gameOver");
const resultTitle = document.getElementById("resultTitle");
const resultDescription = document.getElementById("resultDescription");

const winningCombinations = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
];

let boards = [];
let boardWinners = [];
let winningCells = [];

let currentPlayer = "X";
let nextBoard = null;
let gameFinished = false;
let bigWinningLine = [];

function initializeGame() {

    boards = Array.from(
        { length: 9 },
        () => Array(9).fill("")
    );

    boardWinners = Array(9).fill("");
    winningCells = Array.from({ length: 9 }, () => []);

    currentPlayer = "X";
    nextBoard = null;
    gameFinished = false;
    bigWinningLine = [];

    gameOver.classList.remove("show");

    renderGame();
}

function checkSmallWinner(board) {

    for (const combination of winningCombinations) {

        const [a, b, c] = combination;

        if (
            board[a] &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            return {
                winner: board[a],
                cells: combination
            };

        }

    }

    return null;
}

function checkBigWinner() {

    for (const combination of winningCombinations) {

        const [a, b, c] = combination;

        if (
            boardWinners[a] !== "" &&
            boardWinners[a] !== "D" &&
            boardWinners[a] === boardWinners[b] &&
            boardWinners[b] === boardWinners[c]
        ) {

            return {
                winner: boardWinners[a],
                cells: combination
            };

        }

    }

    return null;
}

function isBoardAvailable(index) {

    return boardWinners[index] === "";

}

function makeMove(boardIndex, cellIndex) {

    if (gameFinished) return;

    if (!isBoardAvailable(boardIndex)) return;

    if (
        nextBoard !== null &&
        boardIndex !== nextBoard
    ) {
        return;
    }

    if (boards[boardIndex][cellIndex] !== "") return;

    boards[boardIndex][cellIndex] = currentPlayer;

    const smallResult = checkSmallWinner(boards[boardIndex]);

    if (smallResult) {

        boardWinners[boardIndex] = currentPlayer;

        winningCells[boardIndex] = smallResult.cells;

    } else if (boards[boardIndex].every(cell => cell !== "")) {

        boardWinners[boardIndex] = "D";

    }

    const bigResult = checkBigWinner();

    if (bigResult) {

        bigWinningLine = bigResult.cells;
        gameFinished = true;

        renderGame();
        showWinner(bigResult.winner);

        return;

    }

    const allCompleted = boardWinners.every(
        winner => winner !== ""
    );

    if (allCompleted) {

        gameFinished = true;

        renderGame();
        showWinner("D");

        return;

    }

    currentPlayer = currentPlayer === "X" ? "O" : "X";

    if (isBoardAvailable(cellIndex)) {

        nextBoard = cellIndex;

    } else {

        nextBoard = null;

    }

    renderGame();

}

function renderGame() {

    bigBoard.innerHTML = "";

    playerX.classList.toggle(
        "active",
        currentPlayer === "X" && !gameFinished
    );

    playerO.classList.toggle(
        "active",
        currentPlayer === "O" && !gameFinished
    );

    if (!gameFinished) {

        statusTitle.textContent =
            `Player ${currentPlayer}'s turn`;

        if (nextBoard === null) {

            statusDescription.textContent =
                "Choose any available board.";

            statusTag.textContent = "FREE PLAY";

        } else {

            statusDescription.textContent =
                `You must play in board ${nextBoard + 1}.`;

            statusTag.textContent =
                `BOARD ${nextBoard + 1}`;

        }

    }

    for (let boardIndex = 0; boardIndex < 9; boardIndex++) {

        const board = document.createElement("div");

        board.className = "small-board";

        const isAvailable = isBoardAvailable(boardIndex);

        const isPlayable =
            isAvailable &&
            (nextBoard === null || nextBoard === boardIndex);

        if (isPlayable && !gameFinished) {

            board.classList.add("playable");

        } else if (!isAvailable) {

            if (boardWinners[boardIndex] === "D") {

                board.classList.add("drawn");

            } else {

                board.classList.add("won");

            }

        } else {

            board.classList.add("inactive");

        }

        for (let cellIndex = 0; cellIndex < 9; cellIndex++) {

            const cell = document.createElement("button");

            cell.className = "cell";

            const value = boards[boardIndex][cellIndex];

            cell.textContent = value;

            if (value === "X") {
                cell.classList.add("x");
            }

            if (value === "O") {
                cell.classList.add("o");
            }

            if (
                winningCells[boardIndex].includes(cellIndex)
            ) {

                cell.classList.add("winning-cell");

            }

            cell.disabled =
                gameFinished ||
                !isPlayable ||
                value !== "";

            cell.addEventListener("click", () => {

                makeMove(boardIndex, cellIndex);

            });

            board.appendChild(cell);

        }

        if (!isAvailable) {

            const overlay = document.createElement("div");

            overlay.className = "board-result";

            if (boardWinners[boardIndex] === "X") {

                overlay.textContent = "X";
                overlay.classList.add("x-result");

            } else if (boardWinners[boardIndex] === "O") {

                overlay.textContent = "O";
                overlay.classList.add("o-result");

            } else {

                overlay.textContent = "DRAW";
                overlay.classList.add("draw-result");

            }

            board.appendChild(overlay);

        }

        if (bigWinningLine.includes(boardIndex)) {

            board.style.borderColor = "white";
            board.style.borderWidth = "3px";

        }

        bigBoard.appendChild(board);

    }

}

function showWinner(winner) {

    if (winner === "D") {

        resultTitle.textContent = "IT'S A DRAW";

        resultDescription.textContent =
            "Neither player managed to claim the big board.";

    } else {

        resultTitle.textContent =
            `PLAYER ${winner} WINS!`;

        resultDescription.textContent =
            `Player ${winner} conquered the nine boards.`;

    }

    gameOver.classList.add("show");

}

function newGame() {

    initializeGame();

}

initializeGame();

</script>

</body>
</html>
